
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title></title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    .video-box {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: transparent;
      cursor: pointer;
      outline: none;
    }

    video::-webkit-media-controls {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="video-box">
    <video
      id="myVideo"
      src="./fire.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      disablepictureinpicture
      aria-label="点击播放或暂停视频"
    ></video>
  </div>

  <script>
    const video = document.getElementById("myVideo");

    video.addEventListener("click", async () => {
      if (video.paused) {
        if (video.ended) {
          video.currentTime = 0;
        }

        try {
          await video.play();
        } catch (error) {
          console.error("视频播放失败:", error);
        }
      } else {
        video.pause();
      }
    });
  </script>

</body>
</html>
